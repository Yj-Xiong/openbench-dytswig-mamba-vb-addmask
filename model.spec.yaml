name: dytswig_mamba_vb_addmask_fp32
task: SE
model:
  uid: dytswig-mamba-vb-addmask-fp32
  architecture: DyTSwiG-Mamba
  version: 1.55M-VoiceBank-DEMAND-AddMask
  task: SE
  languages: [auto]
runtime:
  device: cuda
  dtype: float32
  chip: RTX3090
  batch_size: 1
io:
  input_type: audio_path
  output_type: audio_path
  schema:
    input:
      audio_path:
        type: string
        required: true
      output_path:
        type: string
        required: false
    output:
      audio_path:
        type: string
        required: true
      sample_rate:
        type: integer
        required: true
protocols:
  strict_core:
    enabled: true
    param_map:
      precision:
        model_param: dtype
        mapping:
          float32: torch.float32
      max_batch_size:
        model_param: batch_size
        mapping:
          "1": 1
server:
  command: [".venv/bin/python", "server.py"]
  env:
    MODEL_PATH: ckpt/g_vb_AddMask_PESQ3.64_CSIG3.83
    MODEL_DEVICE: cuda
  timeout: 300
